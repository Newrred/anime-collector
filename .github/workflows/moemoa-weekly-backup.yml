# Review artifact only. Not installed under .github/workflows.
# Approval must bind this exact file and MOEMOA_BACKUP_WEEKLY_ENABLED activation.
name: MOEMOA weekly encrypted backup
on:
  schedule:
    # Sunday 03:00 Asia/Seoul, expressed in UTC.
    - cron: '0 18 * * 6'
  workflow_dispatch:
    inputs:
      confirm_backup:
        description: Run the exact approved encrypted incremental backup
        required: true
        type: boolean
        default: false
      inspect_only:
        description: Inspect authenticated state only; no capture or upload
        required: true
        type: boolean
        default: true
      recover_missing_run_id:
        description: Exact failed run ID for approved manual recovery only
        required: false
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: moemoa-production-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.repository == 'Newrred/anime-collector' && github.ref == 'refs/heads/master' && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.confirm_backup))
    runs-on: ubuntu-24.04
    environment: moemoa-backup
    timeout-minutes: 60
    container:
      image: postgres:17-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    defaults:
      run:
        shell: bash
    steps:
      # Environment-scoped variables are read after the environment is selected.
      # They are intentionally not used in the job-level if expression.
      - name: Resolve separately approved scheduled or manual admission
        id: admission
        env:
          BACKUP_ENABLED: ${{ vars.MOEMOA_BACKUP_RUN_ENABLED }}
          WEEKLY_ENABLED: ${{ vars.MOEMOA_BACKUP_WEEKLY_ENABLED }}
          EVENT_NAME: ${{ github.event_name }}
          INSPECT_ONLY: ${{ inputs.inspect_only }}
        run: |
          set -euo pipefail
          run_allowed=false
          backup_mode=--inspect-state
          case "$EVENT_NAME" in
            schedule)
              if [ "$WEEKLY_ENABLED" = true ]; then
                run_allowed=true
                backup_mode=--run
              fi
              ;;
            workflow_dispatch)
              if [ "$BACKUP_ENABLED" = true ]; then
                run_allowed=true
                if [ "$INSPECT_ONLY" != true ]; then backup_mode=--run; fi
              fi
              ;;
          esac
          echo "run_allowed=$run_allowed" >> "$GITHUB_OUTPUT"
          echo "backup_mode=$backup_mode" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.admission.outputs.run_allowed == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.admission.outputs.run_allowed == 'true'
        with:
          node-version: '24.14.1'
      - name: Prepare isolated backup tools
        if: steps.admission.outputs.run_allowed == 'true'
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install --no-install-recommends -y python3 python3-cryptography ca-certificates
          pg_dump --version
      - name: Capture encrypted delta and commit authenticated checkpoint
        if: steps.admission.outputs.run_allowed == 'true'
        env:
          MOEMOA_BACKUP_RECOVER_MISSING_RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.recover_missing_run_id || '' }}
          BACKUP_MODE: ${{ steps.admission.outputs.backup_mode }}
          MOEMOA_BACKUP_RUN_ENABLED: 'true'
          MOEMOA_BACKUP_DRIVE_CLIENT_ID: ${{ vars.MOEMOA_BACKUP_DRIVE_CLIENT_ID }}
          MOEMOA_BACKUP_DRIVE_FOLDER_ID: ${{ vars.MOEMOA_BACKUP_DRIVE_FOLDER_ID }}
          MOEMOA_BACKUP_DRIVE_CLIENT_SECRET: ${{ secrets.MOEMOA_BACKUP_DRIVE_CLIENT_SECRET }}
          MOEMOA_BACKUP_DRIVE_REFRESH_TOKEN: ${{ secrets.MOEMOA_BACKUP_DRIVE_REFRESH_TOKEN }}
          SUPABASE_URL: https://okchpyagfucpzpyrfgol.supabase.co
          SUPABASE_DB_URL: ${{ secrets.MOEMOA_BACKUP_DATABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MOEMOA_BACKUP_STORAGE_KEY }}
          MOEMOA_BACKUP_CA_PEM: ${{ secrets.MOEMOA_BACKUP_CA_PEM }}
          MOEMOA_BACKUP_RECOVERY_KEY: ${{ secrets.MOEMOA_BACKUP_RECOVERY_KEY }}
        run: |
          set -euo pipefail
          umask 077
          node tools/operations/run-weekly-backup.mjs "$BACKUP_MODE"
# No payload/cache/artifact uploads, automatic parent deletion or permission changes.
