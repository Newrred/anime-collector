name: Private image cleanup
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: private-image-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: vars.MOEMOA_PRIVATE_IMAGE_CLEANUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Invoke approved cleanup endpoint
        env:
          CLEANUP_ORIGIN: ${{ vars.MOEMOA_PRIVATE_IMAGE_CLEANUP_ORIGIN }}
          CLEANUP_SECRET: ${{ secrets.MOEMOA_PRIVATE_IMAGE_CLEANUP_SECRET }}
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const origin = new URL(process.env.CLEANUP_ORIGIN);
          if (origin.protocol !== 'https:' || origin.username || origin.password || origin.pathname !== '/' || origin.search || origin.hash || !process.env.CLEANUP_SECRET || process.env.CLEANUP_SECRET.length < 32) throw Error('Invalid cleanup configuration');
          const response = await fetch(new URL('/api/private-image-cleanup', origin), { headers: { Authorization: `Bearer ${process.env.CLEANUP_SECRET}` }, redirect: 'error', signal: AbortSignal.timeout(45000) });
          if (!response.ok) throw Error(`Cleanup HTTP ${response.status}`);
          const result = await response.json();
          if (!Number.isInteger(result.deleted) || result.deleted < 0 || result.deleted > 50 || result.failed !== 0) throw Error('Invalid cleanup result');
          console.log(JSON.stringify({ deleted: result.deleted, failed: result.failed }));
          JS
