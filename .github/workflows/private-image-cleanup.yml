name: Private image maintenance
on:
  schedule:
    - cron: '7 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-image-cleanup
  cancel-in-progress: false
jobs:
  cleanup:
    if: vars.MOEMOA_PRIVATE_IMAGE_CLEANUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean retired images and refresh observed capacity
        env:
          CLEANUP_ORIGIN: ${{ vars.MOEMOA_PRIVATE_IMAGE_CLEANUP_ORIGIN }}
          CLEANUP_SECRET: ${{ secrets.MOEMOA_PRIVATE_IMAGE_CLEANUP_SECRET }}
          STORAGE_ALERT_BYTES: ${{ vars.MOEMOA_PRIVATE_STORAGE_ALERT_BYTES }}
          READ_ALERT_BYTES: ${{ vars.MOEMOA_PRIVATE_READ_ALERT_BYTES }}
        run: node scripts/private-image-maintenance.mjs
