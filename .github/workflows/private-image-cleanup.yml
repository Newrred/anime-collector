name: Private image maintenance
on:
  schedule:
    - cron: '7 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.ref == 'refs/heads/codex/phone-test' && 'phone-test-private-image-cleanup' || 'private-image-cleanup' }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: github.ref == 'refs/heads/master' && vars.MOEMOA_PRIVATE_IMAGE_CLEANUP_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Clean retired images and refresh observed capacity
        env:
          CLEANUP_ORIGIN: ${{ vars.MOEMOA_PRIVATE_IMAGE_CLEANUP_ORIGIN }}
          CLEANUP_SECRET: ${{ secrets.MOEMOA_PRIVATE_IMAGE_CLEANUP_SECRET }}
          STORAGE_ALERT_BYTES: ${{ vars.MOEMOA_PRIVATE_STORAGE_ALERT_BYTES }}
          READ_ALERT_BYTES: ${{ vars.MOEMOA_PRIVATE_READ_ALERT_BYTES }}
          PUBLIC_CLEANUP_ENABLED: ${{ vars.MOEMOA_PUBLIC_IMAGE_CLEANUP_ENABLED }}
          # Manual verification observes only; scheduled maintenance keeps cleanup.
          OBSERVE_ONLY: ${{ github.event_name == 'workflow_dispatch' }}
        run: node scripts/private-image-maintenance.mjs
  phone-test-cleanup:
    # This job is manually started on the test branch. It is not a test cron.
    if: github.event_name == 'workflow_dispatch' && github.repository == 'Newrred/anime-collector' && github.ref == 'refs/heads/codex/phone-test'
    environment: moemoa-test-cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Clean retired private images in moemoa-test only
        env:
          MOEMOA_TEST_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MOEMOA_TEST_SUPABASE_SERVICE_ROLE_KEY }}
        run: node tools/private-images/run-phone-test-cleanup.mjs --apply
