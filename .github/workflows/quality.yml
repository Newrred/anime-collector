name: Service quality
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publication-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq
      - run: sudo apt-get install -y postgresql-16
      - run: PG_BIN=/usr/lib/postgresql/16/bin bash tools/publication-boundary/run-local-postgres.sh
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Catalog image decode tests also require a real browser.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run catalog:test
      - run: npm run build
      - run: node scripts/run-e2e.mjs tests/service-worker.spec.ts tests/release-editing.spec.ts tests/release-sync.spec.ts tests/memory-account-sync.spec.ts tests/memory-owner-boundary.spec.ts tests/memory-indexeddb.spec.ts tests/review-improvements.spec.ts tests/service-finishing.spec.ts tests/memory-board.spec.ts tests/publication-ui.spec.ts tests/title-cross-surface.spec.ts --project=chromium --workers=1 --reporter=line
      - name: Verify Web image intake and phone layout
        run: node scripts/run-e2e.mjs tests/web-image-intake.spec.ts tests/layout-mobile.spec.ts --project=chromium --workers=1 --reporter=line
        env:
          PUBLIC_MEMORY_WEB_IMAGE_INTAKE_V1: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4358
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results
          retention-days: 7
# Production is deployed only by the connected Vercel Git integration.
# This workflow does not deploy; requiring this check before merging is a repo setting.
