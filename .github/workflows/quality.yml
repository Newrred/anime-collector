name: Service quality
on:
  push:
    branches: [master, codex/phone-test, codex/simple-signup-preview]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publication-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq
      - run: sudo apt-get install -y postgresql-16
      - run: PG_BIN=/usr/lib/postgresql/16/bin bash tools/publication-boundary/run-local-postgres.sh
      - run: PG_BIN=/usr/lib/postgresql/16/bin bash tools/card-classification/run-local-postgres.sh
      - run: PG_BIN=/usr/lib/postgresql/16/bin bash tools/private-images/run-retirement-compat.sh
      - run: PG_BIN=/usr/lib/postgresql/16/bin bash tools/identity/run-simple-signup-admission-local.sh
      - run: PG_BIN=/usr/lib/postgresql/16/bin bash tools/identity/run-simple-signup-receipts-local.sh
      - run: PG_BIN=/usr/lib/postgresql/16/bin bash tools/identity/run-public-signup-local.sh
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Catalog image decode tests also require a real browser.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:unit
      - run: npm run catalog:test
      - run: npm run build
      - name: Verify simple signup UI (mocked Google and API)
        run: node scripts/run-simple-signup-e2e.mjs
      - run: node scripts/run-e2e.mjs tests/service-worker.spec.ts tests/release-editing.spec.ts tests/release-sync.spec.ts tests/memory-account-sync.spec.ts tests/memory-cross-device-sync.spec.ts tests/memory-owner-boundary.spec.ts tests/memory-indexeddb.spec.ts tests/review-improvements.spec.ts tests/service-finishing.spec.ts tests/memory-board.spec.ts tests/publication-ui.spec.ts tests/title-cross-surface.spec.ts --project=chromium --workers=1 --reporter=line
      - name: Verify signed-in card composer
        run: node scripts/run-e2e.mjs tests/memory-card-composer.spec.ts tests/memory-save-account.spec.ts --project=chromium --workers=1 --reporter=line
        env:
          PUBLIC_MEMORY_WEB_IMAGE_INTAKE_V1: '1'
          PUBLIC_MEMORY_PRIVATE_IMAGE_SYNC_V1: '1'
      - name: Verify signed-in Web intake, guest gate and phone layout
        run: node scripts/run-e2e.mjs tests/memory-guest-save.spec.ts tests/web-image-intake.spec.ts tests/layout-mobile.spec.ts --project=chromium --workers=1 --reporter=line
        env:
          PUBLIC_MEMORY_WEB_IMAGE_INTAKE_V1: '1'
          PUBLIC_MEMORY_PRIVATE_IMAGE_SYNC_V1: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4358
      - name: Verify signed-in channel photo
        run: node scripts/run-e2e.mjs tests/channel-service.spec.ts --project=chromium --workers=1 --reporter=line --grep "actual local image bytes"
        env:
          PUBLIC_MEMORY_WEB_IMAGE_INTAKE_V1: '1'
          PUBLIC_MEMORY_PRIVATE_IMAGE_SYNC_V1: '1'
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4359
      - name: Verify current Web design and watch records
        run: node scripts/run-channel-e2e.mjs tests/bookshelf-editor.spec.ts tests/title-collection.spec.ts tests/watch-record-flow.spec.ts tests/library-userflow.spec.ts tests/source-independent-title.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results
          retention-days: 7
# Production is deployed only by the connected Vercel Git integration.
# This workflow does not deploy; requiring this check before merging is a repo setting.
